            tabs.forEach(tab => tab.classList.add('hidden'));

            // Update tab buttons

            tabButtons.forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('hover:bg-gray-50');
            });
            
            const activeTab = document.getElementById(`tab-${tabName}`);

                minPrice: parseFloat(document.getElementById('minPrice').value) || 0,
                maxPrice: parseFloat(document.getElementById('maxPrice').value) || Infinity,
                cabinType: document.getElementById('cabinTypeSelect').value,
                shipSize: document.getElementById('shipSizeSelect').value
            };

            currentResults = enhancedCruiseDatabase.filter(cruise => {
                // Apply all filters
                if (filters.destination && cruise.destination !== filters.destination) return false;
                if (filters.cruiseLine && cruise.cruiseLine !== filters.cruiseLine) return false;
                if (filters.duration && !checkDuration(cruise.duration, filters.duration)) return false;
                if (filters.month && cruise.month !== filters.month) return false;
                if (cruise.price < filters.minPrice || cruise.price > filters.maxPrice) return false;
                if (filters.cabinType && !cruise.cabinTypes.some(cabin => cabin.includes(filters.cabinType))) return false;
                if (filters.shipSize && cruise.size !== filters.shipSize) return false;
                return true;
            });

            displaySearchResults();
        }

        function checkDuration(cruiseDuration, filterDuration) {
            const nights = parseInt(cruiseDuration.split(' ')[0]);
            const durationMap = {
                '3-5 Nights': [3, 4, 5],
                '6-8 Nights': [6, 7, 8],
                '9-12 Nights': [9, 10, 11, 12],
                '13+ Nights': [13, 14, 15, 16, 17, 18, 19, 20]
            };
            return durationMap[filterDuration] ? durationMap[filterDuration].includes(nights) : true;
        }

        function displaySearchResults() {
            const searchResultsSection = document.getElementById('searchResults');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultCount = document.getElementById('resultCount');

            searchResultsSection.classList.remove('hidden');
            resultCount.textContent = `${currentResults.length} cruise${currentResults.length !== 1 ? 's' : ''} found`;

            resultsContainer.innerHTML = currentResults.map(cruise => createEnhancedCruiseCard(cruise)).join('');
            searchResultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        function createEnhancedCruiseCard(cruise) {
            const isFavorite = favorites.includes(cruise.id);
            const isCompared = comparedCruises.some(c => c.id === cruise.id);
            
            return `
                <div class="bg-white rounded-lg shadow-lg card-hover overflow-hidden">
                    <div class="relative">
                        <div class="h-48 bg-gradient-to-r from-blue-400 to-purple-500 flex items-center justify-center">
                            <span class="text-6xl">🚢</span>
                        </div>
                        <div class="absolute top-2 right-2 flex space-x-2">
                            <button onclick="toggleFavorite(${cruise.id})" class="p-2 bg-white bg-opacity-80 rounded-full hover:bg-opacity-100 transition">
                                ${isFavorite ? '❤️' : '🤍'}
                            </button>
                            <button onclick="toggleComparison(${cruise.id})" class="p-2 bg-white bg-opacity-80 rounded-full hover:bg-opacity-100 transition ${isCompared ? 'bg-purple-500 text-white' : ''}">
                                ⚖️
                            </button>
                        </div>
                        ${cruise.popularity > 90 ? '<div class="absolute top-2 left-2 popular-badge text-white px-2 py-1 rounded-full text-xs font-bold">🔥 Popular</div>' : ''}
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="text-xl font-bold text-gray-800">${cruise.name}</h4>
                            <div class="flex items-center space-x-1">
                                <span class="text-yellow-400">⭐</span>
                                <span class="text-sm font-medium">${cruise.rating}</span>
                            </div>
                        </div>
                        <p class="text-purple-600 font-medium mb-2">${cruise.cruiseLine}</p>
                        <p class="text-gray-600 mb-3">${cruise.destination} • ${cruise.duration}</p>
                        
                        <div class="space-y-2 mb-4">
                            <div class="flex items-center text-sm text-gray-600">
                                <span class="mr-2">📍</span>
                                <span>${cruise.ports.slice(0, 2).join(', ')}${cruise.ports.length > 2 ? ` +${cruise.ports.length - 2} more` : ''}</span>
                            </div>
                            <div class="flex items-center text-sm text-gray-600">
                                <span class="mr-2">👥</span>
                                <span>${cruise.capacity.toLocaleString()} guests • ${cruise.size} ship</span>
                            </div>
                        </div>

                        <div class="flex justify-between items-center">
                            <div>
                                <span class="text-sm text-gray-500">Starting from</span>
                                <div class="text-2xl font-bold text-green-600">$${cruise.price}</div>
                                <span class="text-sm text-gray-500">per person</span>
                            </div>
                            <div class="space-y-2">
                                <button onclick="viewItinerary(${cruise.id})" class="w-full px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition text-sm">
                                    View Details
                                </button>
                                <button onclick="bookNow(${cruise.id})" class="w-full px-4 py-2 border border-purple-600 text-purple-600 rounded-lg hover:bg-purple-50 transition text-sm">
                                    Book Now
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Popular Dashboard
        function loadPopularDashboard() {
            loadPopularCruiseLines();
            loadTrendingDestinations();
            loadPopularItineraries();
            loadPriceTrends();
        }

        function loadPopularCruiseLines() {
            const cruiseLineStats = {};
            enhancedCruiseDatabase.forEach(cruise => {
                if (!cruiseLineStats[cruise.cruiseLine]) {
                    cruiseLineStats[cruise.cruiseLine] = { count: 0, totalRating: 0, totalPopularity: 0 };
                }
                cruiseLineStats[cruise.cruiseLine].count++;
                cruiseLineStats[cruise.cruiseLine].totalRating += cruise.rating;
                cruiseLineStats[cruise.cruiseLine].totalPopularity += cruise.popularity;
            });

            const sortedLines = Object.entries(cruiseLineStats)
                .map(([name, stats]) => ({
                    name,
                    avgRating: (stats.totalRating / stats.count).toFixed(1),
                    avgPopularity: Math.round(stats.totalPopularity / stats.count),
                    cruiseCount: stats.count
                }))
                .sort((a, b) => b.avgPopularity - a.avgPopularity);

            const container = document.getElementById('popularCruiseLines');
            container.innerHTML = sortedLines.map(line => `
                <div class="bg-gradient-to-br from-purple-50 to-blue-50 p-4 rounded-lg border hover:shadow-lg transition cursor-pointer" onclick="filterByCruiseLine('${line.name}')">
                    <div class="text-center">
                        <div class="text-3xl mb-2">🚢</div>
                        <h4 class="font-bold text-gray-800 mb-1">${line.name}</h4>
                        <div class="flex items-center justify-center space-x-2 mb-2">
                            <span class="text-yellow-400">⭐</span>
                            <span class="text-sm font-medium">${line.avgRating}</span>
                        </div>
                        <div class="text-xs text-gray-600">${line.cruiseCount} cruises</div>
                        <div class="mt-2 bg-purple-600 text-white text-xs px-2 py-1 rounded-full">
                            ${line.avgPopularity}% popularity
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function loadTrendingDestinations() {
            const destinations = [...new Set(enhancedCruiseDatabase.map(c => c.destination))];
            const container = document.getElementById('trendingDestinations');
            
            container.innerHTML = destinations.map(dest => {
                const cruiseCount = enhancedCruiseDatabase.filter(c => c.destination === dest).length;
                const avgPrice = Math.round(enhancedCruiseDatabase.filter(c => c.destination === dest)
                    .reduce((sum, c) => sum + c.price, 0) / cruiseCount);
                
                return `
                    <div class="trending-badge text-white p-4 rounded-lg text-center cursor-pointer hover:opacity-90 transition" onclick="filterByDestination('${dest}')">
                        <div class="text-2xl mb-2">${getDestinationEmoji(dest)}</div>
                        <div class="font-bold text-sm">${dest}</div>
                        <div class="text-xs mt-1">${cruiseCount} cruises</div>
                        <div class="text-xs">from $${avgPrice}</div>
                    </div>
                `;
            }).join('');
        }

        function getDestinationEmoji(destination) {
            const emojis = {
                'Caribbean': '🏝️',
                'Mediterranean': '🏛️',
                'Alaska': '🏔️',
                'Northern Europe': '🏰',
                'Asia': '🏯',
                'Transatlantic': '🌊',
                'Hawaii': '🌺'
            };
            return emojis[destination] || '🚢';
        }

        function loadPopularItineraries() {
            const popularItineraries = enhancedCruiseDatabase
                .sort((a, b) => b.popularity - a.popularity)
                .slice(0, 6);

            const container = document.getElementById('popularItineraries');
            container.innerHTML = popularItineraries.map(cruise => `
                <div class="bg-white border rounded-lg p-4 hover:shadow-lg transition cursor-pointer" onclick="viewItinerary(${cruise.id})">
                    <div class="flex justify-between items-start mb-3">
                        <h4 class="font-bold text-gray-800">${cruise.name}</h4>
                        <div class="luxury-badge text-white px-2 py-1 rounded-full text-xs">
                            #${enhancedCruiseDatabase.indexOf(cruise) + 1} Popular
                        </div>
                    </div>
                    <p class="text-purple-600 font-medium mb-2">${cruise.cruiseLine}</p>
                    <p class="text-gray-600 mb-3">${cruise.destination} • ${cruise.duration}</p>
                    <div class="flex justify-between items-center">
                        <div class="text-green-600 font-bold">$${cruise.price}</div>
                        <div class="flex items-center space-x-1">
                            <span class="text-yellow-400">⭐</span>
                            <span class="text-sm">${cruise.rating}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function loadPriceTrends() {
            const destinations = [...new Set(enhancedCruiseDatabase.map(c => c.destination))];
            const container = document.getElementById('priceTrends');
            
            container.innerHTML = destinations.map(dest => {
                const cruises = enhancedCruiseDatabase.filter(c => c.destination === dest);
                const avgPrice = Math.round(cruises.reduce((sum, c) => sum + c.price, 0) / cruises.length);
                const minPrice = Math.min(...cruises.map(c => c.price));
                const savings = avgPrice - minPrice;
                
                return `
                    <div class="price-trend p-4 rounded-lg border">
                        <div class="flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-gray-800">${dest}</h4>
                                <p class="text-gray-600">Average: $${avgPrice} • Best Deal: $${minPrice}</p>
                            </div>
                            <div class="text-right">
                                <div class="text-green-600 font-bold">Save up to $${savings}</div>
                                <button onclick="filterByDestination('${dest}')" class="text-purple-600 text-sm hover:underline">View Deals</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Sailing Calendar
        function loadSailingCalendar() {
            const container = document.getElementById('sailingCalendar');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            
            // Create calendar header
            const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            let calendarHTML = daysOfWeek.map(day => `<div class="text-center font-bold p-2 bg-purple-100">${day}</div>`).join('');
            
            // Generate calendar days with cruise departures
            for (let i = 1; i <= 35; i++) {
                const hasCruise = Math.random() > 0.7; // Simulate cruise departures
                const cruiseCount = Math.floor(Math.random() * 5) + 1;
                
                calendarHTML += `
                    <div class="border p-2 min-h-16 ${hasCruise ? 'bg-purple-50 hover:bg-purple-100 cursor-pointer' : 'bg-gray-50'}">
                        <div class="text-sm font-medium">${i}</div>
                        ${hasCruise ? `<div class="text-xs text-purple-600">${cruiseCount} departures</div>` : ''}
                    </div>
                `;
            }
            
            container.innerHTML = calendarHTML;
        }

        // Shore Excursions
        function loadShoreExcursions() {
            const container = document.getElementById('excursionsContainer');
            container.innerHTML = shoreExcursions.map(excursion => `
                <div class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition">
                    <div class="flex justify-between items-start mb-3">
                        <h4 class="font-bold text-gray-800">${excursion.name}</h4>
                        <div class="flex items-center space-x-1">
                            <span class="text-yellow-400">⭐</span>
                            <span class="text-sm">${excursion.rating}</span>
                        </div>
                    </div>
                    <p class="text-purple-600 font-medium mb-2">${excursion.port}</p>
                    <p class="text-gray-600 mb-3">${excursion.description}</p>
                    <div class="flex justify-between items-center mb-4">
                        <div class="text-sm text-gray-500">
                            <span class="mr-4">⏱️ ${excursion.duration}</span>
                            <span class="px-2 py-1 bg-${excursion.difficulty === 'Easy' ? 'green' : excursion.difficulty === 'Moderate' ? 'yellow' : 'red'}-100 text-${excursion.difficulty === 'Easy' ? 'green' : excursion.difficulty === 'Moderate' ? 'yellow' : 'red'}-800 rounded-full text-xs">
                                ${excursion.difficulty}
                            </span>
                        </div>
                        <div class="text-xl font-bold text-green-600">$${excursion.price}</div>
                    </div>
                    <button class="w-full gradient-bg text-white py-2 rounded-lg hover:opacity-90 transition">
                        Book Excursion
                    </button>
                </div>
            `).join('');
        }

        // Reviews
        function loadReviews() {
            const container = document.getElementById('reviewsContainer');
            container.innerHTML = cruiseReviews.map(review => {
                const cruise = enhancedCruiseDatabase.find(c => c.id === review.cruiseId);
                return `
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h4 class="font-bold text-gray-800">${review.title}</h4>
                                <p class="text-purple-600">${cruise?.name} - ${cruise?.cruiseLine}</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <div class="flex">
                                    ${'⭐'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}
                                </div>
                                ${review.verified ? '<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full">✓ Verified</span>' : ''}
                            </div>
                        </div>
                        <p class="text-gray-600 mb-3">${review.review}</p>
                        <div class="flex justify-between items-center text-sm text-gray-500">
                            <span>By ${review.reviewer}</span>
                            <span>${review.date}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Utility functions
        function toggleFavorite(cruiseId) {
            const index = favorites.indexOf(cruiseId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(cruiseId);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            
            // Refresh current view
            if (currentResults.length > 0) {
                displaySearchResults();
            }
        }

        function toggleComparison(cruiseId) {
            const cruise = enhancedCruiseDatabase.find(c => c.id === cruiseId);
            const index = comparedCruises.findIndex(c => c.id === cruiseId);
            
            if (index > -1) {
                comparedCruises.splice(index, 1);
            } else if (comparedCruises.length < 3) {
                comparedCruises.push(cruise);
            } else {
                alert('You can only compare up to 3 cruises at a time.');
                return;
            }
            
            updateCompareButton();
            if (currentResults.length > 0) {
                displaySearchResults();
            }
        }

        function updateCompareButton() {
            document.getElementById('compareCount').textContent = `Compare (${comparedCruises.length})`;
        }

        function showComparisonTool() {
            if (comparedCruises.length === 0) {
                alert('Please select cruises to compare first.');
                return;
            }
            
            const modal = document.getElementById('comparisonModal');
            const content = document.getElementById('comparisonContent');
            
            content.innerHTML = `
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b">
                                <th class="text-left p-3">Feature</th>
                                ${comparedCruises.map(cruise => `<th class="text-left p-3">${cruise.name}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="border-b">
                                <td class="p-3 font-medium">Cruise Line</td>
                                ${comparedCruises.map(cruise => `<td class="p-3">${cruise.cruiseLine}</td>`).join('')}
                            </tr>
                            <tr class="border-b">
                                <td class="p-3 font-medium">Destination</td>
                                ${comparedCruises.map(cruise => `<td class="p-3">${cruise.destination}</td>`).join('')}
                            </tr>
                            <tr class="border-b">
                                <td class="p-3 font-medium">Duration</td>
                                ${comparedCruises.map(cruise => `<td class="p-3">${cruise.duration}</td>`).join('')}
                            </tr>
                            <tr class="border-b">
                                <td class="p-3 font-medium">Starting Price</td>
                                ${comparedCruises.map(cruise => `<td class="p-3 text-green-600 font-bold">$${cruise.price}</td>`).join('')}
                            </tr>
                            <tr class="border-b">
                                <td class="p-3 font-medium">Rating</td>
                                ${comparedCruises.map(cruise => `<td class="p-3">${'⭐'.repeat(Math.floor(cruise.rating))} ${cruise.rating}</td>`).join('')}
                            </tr>
                            <tr class="border-b">
                                <td class="p-3 font-medium">Capacity</td>
                                ${comparedCruises.map(cruise => `<td class="p-3">${cruise.capacity.toLocaleString()} guests</td>`).join('')}
                            </tr>
                            <tr class="border-b">
                                <td class="p-3 font-medium">Ship Size</td>
                                ${comparedCruises.map(cruise => `<td class="p-3">${cruise.size}</td>`).join('')}
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="mt-6 flex justify-center space-x-4">
                    ${comparedCruises.map(cruise => `
                        <button onclick="bookNow(${cruise.id})" class="gradient-bg text-white px-6 py-2 rounded-lg hover:opacity-90 transition">
                            Book ${cruise.name}
                        </button>
                    `).join('')}
                </div>
            `;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function hideComparisonTool() {
            document.getElementById('comparisonModal').classList.add('hidden');
            document.getElementById('comparisonModal').classList.remove('flex');
        }

        function showUserMenu() {
            const modal = document.getElementById('userMenuModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function hideUserMenu() {
            document.getElementById('userMenuModal').classList.add('hidden');
            document.getElementById('userMenuModal').classList.remove('flex');
        }

        function viewItinerary(cruiseId) {
            const cruise = enhancedCruiseDatabase.find(c => c.id === cruiseId);
            if (cruise) {
                const itineraryDetails = `
🚢 ${cruise.name}
${cruise.cruiseLine} • ${cruise.ship}
${cruise.shipClass} • Built ${cruise.yearBuilt}

📍 Embarkation: ${cruise.embarkation}
🗓️ Duration: ${cruise.duration}
⭐ Rating: ${cruise.rating}/5
👥 Capacity: ${cruise.capacity.toLocaleString()} guests

PORTS OF CALL:
${cruise.ports.map((port, index) => `Day ${index + 2}: ${port}`).join('\n')}

🎯 ACTIVITIES & FEATURES:
${cruise.activities.slice(0, 4).join(' • ')}

🍽️ DINING OPTIONS:
${cruise.dining.slice(0, 4).join(' • ')}

🍹 BARS & LOUNGES:
${cruise.bars.slice(0, 4).join(' • ')}

✨ SHIP HIGHLIGHTS:
${cruise.highlights.slice(0, 3).join(' • ')}

💰 CABIN TYPES & PRICING:
${cruise.cabinTypes.join('\n')}

🐢 Book through TurtleTides for exclusive deals!
                `;
                alert(itineraryDetails);
            }
        }

        function bookNow(cruiseId) {
            const cruise = enhancedCruiseDatabase.find(c => c.id === cruiseId);
            alert(`Booking ${cruise.name}...\n\nYou would be redirected to our secure booking system to complete your reservation.`);
        }

        function sortResults(criteria) {
            if (criteria === 'price') {
                currentResults.sort((a, b) => a.price - b.price);
            } else if (criteria === 'rating') {
                currentResults.sort((a, b) => b.rating - a.rating);
            } else if (criteria === 'duration') {
                currentResults.sort((a, b) => parseInt(a.duration) - parseInt(b.duration));
            }
            displaySearchResults();
        }

        function filterByCruiseLine(cruiseLine) {
            document.getElementById('cruiseLineSelect').value = cruiseLine;
            showTab('search');
            searchCruises();
        }

        function filterByDestination(destination) {
            document.getElementById('destinationSelect').value = destination;
            showTab('search');
            searchCruises();
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            loadPopularDashboard();
            updateCompareButton();
        });
    </script>
</body>
</html>
